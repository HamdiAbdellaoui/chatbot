base_model: ./models/qwen2.5-base
precision: bf16
load_in_4bit: true
quantization:
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
peft:
  type: lora
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
